<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #fff;
    }

    .container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    h1 {
      font-size: 28px;
      font-weight: 300;
      letter-spacing: 0.5px;
      margin-bottom: 40px;
      text-align: center;
      opacity: 0.9;
    }

    .input-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 8px;
      opacity: 0.8;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    input[type="number"] {
      width: 100%;
      padding: 14px 16px;
      font-size: 16px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      color: #fff;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    input[type="number"]:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.3);
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1);
    }

    input[type="number"]::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 24px;
      font-size: 16px;
      font-weight: 600;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 10px;
      color: #fff;
      cursor: pointer;
      transition: all 0.3s ease;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    .result-container {
      margin-top: 32px;
      text-align: center;
      min-height: 80px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .result-label {
      font-size: 12px;
      opacity: 0.6;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 12px;
    }

    #result {
      font-size: 48px;
      font-weight: 200;
      letter-spacing: -1px;
      opacity: 0;
      transform: scale(0.95);
      animation: slideIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    #result.computed {
      animation: slideIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: scale(0.95) translateY(10px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Add Two</h1>

    <form id="calculator">
      <div class="input-group">
        <label for="input1">First number</label>
        <input type="number" id="input1" placeholder="0" step="any">
      </div>

      <div class="input-group">
        <label for="input2">Second number</label>
        <input type="number" id="input2" placeholder="0" step="any">
      </div>

      <button type="submit">Calculate</button>

      <div class="result-container">
        <div class="result-label">Result</div>
        <output id="result">—</output>
      </div>
    </form>
  </div>

  <script>
    const form = document.getElementById('calculator');
    const input1 = document.getElementById('input1');
    const input2 = document.getElementById('input2');
    const resultOutput = document.getElementById('result');

    function calculate(e) {
      e.preventDefault();

      const a = parseFloat(input1.value) || 0;
      const b = parseFloat(input2.value) || 0;
      const sum = a + b;

      // Trigger animation by resetting and re-applying the class
      resultOutput.classList.remove('computed');
      void resultOutput.offsetWidth; // Force reflow
      resultOutput.classList.add('computed');

      // Display result
      resultOutput.textContent = sum;
    }

    form.addEventListener('submit', calculate);

    // Calculate on input change for live feedback
    input1.addEventListener('change', calculate);
    input2.addEventListener('change', calculate);
  </script>
</body>
</html>
