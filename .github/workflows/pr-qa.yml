name: PR QA (agent)

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: pr-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Detect app
        id: detect
        run: |
          if [ -f app/package.json ]; then
            echo "has_app=true" >> $GITHUB_OUTPUT
          else
            echo "has_app=false" >> $GITHUB_OUTPUT
            echo "::notice::No app/package.json found — skipping QA agent run."
          fi

      - name: Check secret
        if: steps.detect.outputs.has_app == 'true'
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is not set. Add it in Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Setup pnpm
        if: steps.detect.outputs.has_app == 'true'
        uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json

      - name: Setup Node
        if: steps.detect.outputs.has_app == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        if: steps.detect.outputs.has_app == 'true'
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        if: steps.detect.outputs.has_app == 'true'
        working-directory: app
        run: pnpm exec playwright install --with-deps chromium

      - name: Start dev server
        if: steps.detect.outputs.has_app == 'true'
        working-directory: app
        run: |
          # Bind explicitly to 127.0.0.1 — on GitHub runners, vite's default
          # `localhost` resolves to ::1 only, which wait-on can't reach.
          pnpm exec vite --host 127.0.0.1 --port 5173 > ../dev-server.log 2>&1 &
          echo "DEV_PID=$!" >> $GITHUB_ENV

      - name: Wait for dev server
        if: steps.detect.outputs.has_app == 'true'
        run: npx -y wait-on http://127.0.0.1:5173 --timeout 60000

      - name: Build prompt + MCP config
        if: steps.detect.outputs.has_app == 'true'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p .qa-run
          # Diff capped at 8k lines to keep the prompt bounded
          git diff "$BASE_SHA"..."$HEAD_SHA" | head -n 8000 > .qa-run/pr.diff
          # Render the full prompt
          {
            echo "PR title: $PR_TITLE"
            echo
            echo "PR body:"
            echo "$PR_BODY"
            echo
            echo "Diff vs base (truncated to 8k lines):"
            echo '```diff'
            cat .qa-run/pr.diff
            echo '```'
            echo
            cat .github/qa-prompt.md
          } > .qa-run/prompt.md
          # MCP config — written to a file because the v1 action does not accept inline mcp_config
          cat > .qa-run/mcp.json <<'JSON'
          {
            "mcpServers": {
              "playwright": {
                "command": "npx",
                "args": ["-y", "@playwright/mcp@latest", "--headless"]
              }
            }
          }
          JSON
          # Stash the rendered prompt in $GITHUB_ENV (multi-line) for the action input
          {
            echo "QA_PROMPT<<QA_EOF"
            cat .qa-run/prompt.md
            echo "QA_EOF"
          } >> $GITHUB_ENV

      - name: Run Claude QA agent
        if: steps.detect.outputs.has_app == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: ${{ env.QA_PROMPT }}
          claude_args: |
            --max-turns 25
            --allowedTools "Bash,Read,Write,mcp__playwright__*"
            --mcp-config .qa-run/mcp.json

      - name: Upload QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report-pr-${{ github.event.pull_request.number }}
          path: |
            qa-report.md
            .qa-run/**
            screenshots/**
            dev-server.log
          if-no-files-found: ignore

      - name: Tear down dev server
        if: always()
        run: kill "${DEV_PID:-0}" 2>/dev/null || true
